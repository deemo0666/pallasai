[package]
name = "dsh-search"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
grep = "0.4.1"
ignore = "0.4.34"
serde_json = "1"
rgcore = { path = "rgcore" }
regex = { version = "1", default-features = false, features = ["std", "perf"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
