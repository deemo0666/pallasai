name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulator:
    # The app uses iOS 27 APIs: the runner image with Xcode 27.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the iOS Simulator
        run: >
          xcodebuild -project PallasCore.xcodeproj -scheme PallasCore
          -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO -quiet build
